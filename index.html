<body><div class="app"><header class="top"><div class="pill" style="background:#ffffff25;color:#fff">CSC121 • PROTOTYPE V1</div><h1>Interactive Learning</h1><p>Chapter 1: Introduction to Computer Systems</p><div class="progress"><div id="bar"></div></div><p id="progText" style="font-size:12px">0 of 9 learning modules completed</p></header><main class="wrap" id="main"></main><div class="footer">Designed as a mobile-first self-learning prototype • No login required</div></div>
<script>
const modules=[
{t:'Computer Basics',s:'Definition, hardware, software and IPO+S',body:`<span class="pill">LEARN</span><h2>What is a computer?</h2><div class="concept">A computer is an electronic device controlled by instructions stored in memory. It can <b>accept data</b>, <b>process</b> it according to rules, <b>produce results</b>, and <b>store</b> the results.</div><p>A computer has two major components: <b>hardware</b> (electronic/physical devices) and <b>software</b> (instructions or programs).</p><h3>IPO + Storage</h3><div class="row"><div class="box">INPUT<br><small>enter data</small></div><div class="box">PROCESS<br><small>work on data</small></div><div class="box">OUTPUT<br><small>produce information</small></div><div class="box">STORAGE<br><small>keep for later</small></div></div>`,q:['Which is software?',['Keyboard','RAM','Operating system','Monitor'],2,'Software is a set of instructions/programs; an operating system is software.']},
{t:'Types of Computers',s:'PC, server/midrange, mainframe, supercomputer',body:`<span class="pill">CLASSIFY</span><h2>Types of computers</h2><p><b>Personal computer:</b> performs its own input, processing, output and storage activities.</p><p><b>Midrange/server:</b> more processing capability than a personal computer but less than a mainframe.</p><p><b>Mainframe:</b> large, powerful system that can handle hundreds or thousands of connected users simultaneously.</p><p><b>Supercomputer:</b> the fastest and most powerful category in the chapter.</p>`,q:['A large computer serving hundreds or thousands of connected users is a...',['Personal computer','Mainframe','Keyboard','Scanner'],1,'The chapter describes a mainframe as a large, powerful computer able to handle many connected users simultaneously.']},
{t:'Computer Generations',s:'Mechanical era through fifth generation',body:`<span class="pill">TIMELINE</span><h2>Evolution of computers</h2><div class="timeline"><div><b>0th</b><br>1642–1940<br>Mechanical</div><div><b>1st</b><br>1940–1955<br>Vacuum tubes</div><div><b>2nd</b><br>1955–1965<br>Transistors</div><div><b>3rd</b><br>1965–1980<br>Integrated circuits</div><div><b>4th</b><br>1980–Present<br>VLSI / microprocessor</div><div><b>5th</b><br>Present–Beyond<br>ULSI / AI</div></div><p>Across the generations, the chapter highlights changes such as smaller size, greater reliability and efficiency, and increasingly powerful technology.</p>`,q:['Which technology identifies the 3rd generation in the chapter?',['Vacuum tube','Transistor','Integrated circuit','ULSI'],2,'Third-generation computers used integrated circuits (ICs) in place of individual transistors.']},
{t:'Von Neumann Architecture',s:'CPU, CU, ALU, memory, I/O, storage and bus',body:`<span class="pill">EXPLORE</span><h2>Von Neumann Architecture</h2><p>Data and instructions are stored in main memory while being processed. The CPU executes instructions fetched from memory.</p><div class="diagram"><div class="box">INPUT</div><div class="box cpu">CPU<br><small>CU + ALU + Interface</small></div><div class="box">OUTPUT</div><div></div><div class="box memory">MEMORY<br><small>instructions + data</small></div><div></div></div><p><b>CU</b> controls instruction processing and data movement. <b>ALU</b> performs arithmetic and Boolean logical calculations. A <b>bus</b> carries signals between components.</p>`,q:['Which CPU component performs arithmetic and logical operations?',['Control Unit','ALU','Memory','Input unit'],1,'The Arithmetic/Logic Unit (ALU) performs arithmetic and Boolean logical calculations.']},
{t:'Data & Instructions',s:'Character encoding: ASCII, EBCDIC and Unicode',body:`<span class="pill">LEARN</span><h2>Character Encoding</h2><p>Character encoding assigns a binary representation to letters, numbers and special characters so computers can communicate using common codes.</p><div class="grid"><div class="card"><b>ASCII</b><p>American Standard Code for Information Interchange. The slides describe ASCII as a 7-bit character set with 128 characters.</p></div><div class="card"><b>EBCDIC</b><p>Extended Binary Coded Decimal Interchange Code. An 8-bit code used mainly on IBM mainframe and midrange systems.</p></div><div class="card"><b>Unicode</b><p>A standard for consistent representation and handling of text across writing systems; the chapter slide describes it as using 16 bits.</p></div></div>`,q:['Which encoding is described as an 8-bit code mainly used on IBM mainframe systems?',['ASCII','EBCDIC','Unicode','VLSI'],1,'EBCDIC is described in the chapter as an 8-bit character encoding mainly used on IBM mainframe and midrange systems.']},
{t:'System Unit',s:'Chassis, system board, sockets, chips, slots and buses',body:`<span class="pill">EXPLORE</span><h2>Inside the system unit</h2><p>The <b>system chassis</b> houses most electronic components. The <b>system board</b> contains electronic components and connection points.</p><p><b>Sockets</b> connect chips. <b>Slots</b> provide connection points for specialized cards and expansion. <b>Bus lines</b> provide pathways for communication among electronic components.</p>`,q:['What is the purpose of expansion slots on the system board?',['Store files permanently','Connect specialized cards/circuit boards','Display output','Encode characters'],1,'Slots provide connection points for specialized cards or circuit boards and expand the computer.']},
{t:'Processor & Memory',s:'Microprocessor, RAM, ROM, flash and virtual memory',body:`<span class="pill">COMPARE</span><h2>Processor and Memory</h2><p>The CPU/processor is contained on a single chip called a <b>microprocessor</b>. Its two basic components highlighted in the system-unit section are the <b>Control Unit</b> and <b>ALU</b>.</p><div class="grid"><div class="card"><b>RAM</b><p>Volatile working memory; loses contents when power is turned off.</p></div><div class="card"><b>ROM</b><p>Non-volatile memory; retains contents when power is removed.</p></div><div class="card"><b>Flash Memory</b><p>Can be updated like RAM but is non-volatile like ROM.</p></div><div class="card"><b>Virtual Memory</b><p>Uses disk storage temporarily when physical RAM is insufficient; it can make the computer slower to respond.</p></div></div>`,q:['You open too many programs and physical RAM becomes full. Which concept can temporarily use disk storage?',['ROM','ASCII','Virtual memory','ALU'],2,'Virtual memory compensates for physical RAM shortages by temporarily transferring data between RAM and disk storage.']},
{t:'Input Devices',s:'Entering data and instructions',body:`<span class="pill">CLASSIFY</span><h2>Input devices</h2><p>Input devices are hardware components that allow users to enter data and instructions into a computer or mobile device.</p><p>Examples in the chapter include <b>keyboard, pointing devices, gaming controllers, scanning devices, readers, image-capturing devices, audio input devices</b> and <b>biometric authentication devices</b>.</p>`,q:['Which device is used to enter data into a computer?',['Monitor','Printer','Keyboard','Speaker'],2,'A keyboard is an input device because it lets the user enter data and instructions.']},
{t:'Output Devices',s:'Presenting information to users',body:`<span class="pill">CLASSIFY</span><h2>Output devices</h2><p>Output devices are hardware components that convey information from a computer or mobile device to one or more people.</p><p>The chapter contrasts <b>input</b> (data entering the computer) with <b>output</b> (information coming out).</p>`,q:['Which is an output device?',['Keyboard','Scanner','Monitor','Mouse'],2,'A monitor conveys information from the computer to the user, so it is an output device.']}
];

const WEB_APP_URL='https://script.google.com/macros/s/AKfycby5P0SLmboPaZ7qIejldSX86pbICUuJD8ccOXn2Qt1LdRX7ZrIxBdUMsJ9ujogcg2MP/exec';
let done=JSON.parse(localStorage.getItem('csc121done')||'[]');let currentQuiz=[];let qi=0,score=0,answers=[];let lastResult=null;
let student=JSON.parse(localStorage.getItem('csc121student')||'null');
const main=document.getElementById('main');function update(){document.getElementById('bar').style.width=(done.length/9*100)+'%';document.getElementById('progText').textContent=`${done.length} of 9 learning modules completed`;}
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function studentScreen(){update();main.innerHTML=`<div class="card"><span class="pill">CSC121 • CHAPTER 1</span><h2>Student Information</h2><p class="muted">Enter your details once. They will be attached to your Chapter Challenge result.</p><div class="field"><label>Student Name</label><input id="sname" autocomplete="name" placeholder="e.g. Ahmad Ali" value="${student?esc(student.name):''}"></div><div class="field"><label>Student ID</label><input id="sid" placeholder="e.g. 2026123456" value="${student?esc(student.id):''}"></div><div class="field"><label>Group</label><input id="sgroup" placeholder="e.g. M3CS1101A" value="${student?esc(student.group):''}"></div><div id="formmsg" class="feedback"></div><button class="btn" onclick="saveStudent()">Start Learning →</button></div>`}
function saveStudent(){const name=document.getElementById('sname').value.trim(),id=document.getElementById('sid').value.trim(),group=document.getElementById('sgroup').value.trim();if(!name||!id||!group){const f=document.getElementById('formmsg');f.className='feedback bad';f.innerHTML='<b>Please complete all three fields.</b>';return}student={name,id,group};localStorage.setItem('csc121student',JSON.stringify(student));home()}
function editStudent(){studentScreen()}
function home(){if(!student){studentScreen();return}update();main.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><div><h2 style="margin-bottom:4px">Welcome, ${esc(student.name)}</h2><div class="muted">${esc(student.id)} • ${esc(student.group)}</div></div><button class="btn ghost" onclick="editStudent()">Edit Student Info</button></div><p class="muted">Learn the concepts, try a quick check after each module, then attempt the randomized Chapter Challenge.</p><div class="row"><span class="pill">Mobile friendly</span><span class="pill">Immediate feedback</span><span class="pill">Randomized challenge</span><span class="pill">C1 + C2</span></div></div><div class="grid">${modules.map((m,i)=>`<button class="card module" onclick="lesson(${i})"><div class="num">MODULE ${i+1} ${done.includes(i)?'✓':''}</div><h3>${m.t}</h3><small>${m.s}</small></button>`).join('')}</div><div class="card"><h2>Chapter Challenge</h2><p>20 randomized questions: <b>10 C1 + 10 C2</b>. Immediate explanation after each answer.</p><button class="btn" onclick="startQuiz()">Start Chapter Challenge</button> <button class="btn ghost" onclick="resetProgress()">Reset Progress</button></div>`}
function lesson(i){const m=modules[i];main.innerHTML=`<div class="card lesson">${m.body}</div><div class="card"><div class="q">Quick Check <span class="tag">Practice</span><br><small>${m.q[0]}</small></div>${m.q[1].map((c,j)=>`<button class="choice" onclick="checkModule(${i},${j},this)">${c}</button>`).join('')}<div id="fb" class="feedback"></div><div class="row"><button class="btn secondary" onclick="home()">← Home</button><button id="next" class="btn hidden" onclick="nextModule(${i})">Continue →</button></div></div>`;scrollTo(0,0)}
function checkModule(i,j,el){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const m=modules[i],ok=j===m.q[2];el.classList.add(ok?'correct':'wrong');if(!ok)document.querySelectorAll('.choice')[m.q[2]].classList.add('correct');const f=document.getElementById('fb');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=`<b>${ok?'Correct!':'Not quite.'}</b> ${m.q[3]}`;document.getElementById('next').classList.remove('hidden');if(!done.includes(i)){done.push(i);localStorage.setItem('csc121done',JSON.stringify(done));update()}}
function nextModule(i){i<8?lesson(i+1):home()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(){const c1=shuffle(bank.filter(x=>x[0]=='C1')).slice(0,10),c2=shuffle(bank.filter(x=>x[0]=='C2')).slice(0,10);currentQuiz=shuffle([...c1,...c2]);qi=0;score=0;answers=[];renderQ()}
function renderQ(){const x=currentQuiz[qi];const opts=x[2].map((v,i)=>({v,i}));const sh=shuffle(opts);main.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Question ${qi+1} / 20</span><span class="pill">${x[0]} • ${x[5]}</span></div><div class="q" style="margin-top:18px">${x[1]}</div>${sh.map(o=>`<button class="choice" data-orig="${o.i}" onclick="answerQ(${o.i},this)">${o.v}</button>`).join('')}<div id="fb" class="feedback"></div><button id="nq" class="btn hidden" onclick="advanceQ()">${qi==19?'See Results':'Next Question →'}</button></div>`;scrollTo(0,0)}
function answerQ(j,el){const x=currentQuiz[qi],ok=j===x[3];if(ok)score++;answers.push({topic:x[5],level:x[0],ok});document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.orig===x[3])b.classList.add('correct')});if(!ok)el.classList.add('wrong');const f=document.getElementById('fb');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=`<b>${ok?'Correct!':'Incorrect.'}</b> ${x[4]}`;document.getElementById('nq').classList.remove('hidden')}
function advanceQ(){qi++;qi<20?renderQ():results()}
function topicKey(topic){const map={'Computer Basics':'computerBasics','Types of Computers':'types','Types':'types','Computer Generations':'generations','Generations':'generations','Von Neumann':'vonNeumann','Data & Instructions':'dataInstructions','System Unit':'systemUnit','Processor & Memory':'processorMemory','Input Devices':'inputDevices','Output Devices':'outputDevices','Input/Output':'inputDevices'};return map[topic]||null}
function results(){const pct=Math.round(score/20*100),topics={},levels={C1:{n:0,s:0},C2:{n:0,s:0}};answers.forEach(a=>{topics[a.topic]??={n:0,s:0};topics[a.topic].n++;topics[a.topic].s+=a.ok?1:0;levels[a.level].n++;levels[a.level].s+=a.ok?1:0});const topicPct={computerBasics:0,types:0,generations:0,vonNeumann:0,dataInstructions:0,systemUnit:0,processorMemory:0,inputDevices:0,outputDevices:0};Object.entries(topics).forEach(([k,v])=>{const key=topicKey(k);if(key)topicPct[key]=Math.round(v.s/v.n*100)});const attempt=+(localStorage.getItem('csc121attempt_'+student.id)||0)+1;lastResult={studentName:student.name,studentId:student.id,group:student.group,attempt,score,total:20,percentage:pct,c1Correct:levels.C1.s,c1Total:levels.C1.n,c2Correct:levels.C2.s,c2Total:levels.C2.n,...topicPct};main.innerHTML=`<div class="card" style="text-align:center"><div class="pill">CHAPTER 1 RESULT</div><h3>${esc(student.name)} • ${esc(student.id)} • ${esc(student.group)}</h3><div class="result">${score}/20</div><h2>${pct}%</h2><p><b>C1:</b> ${levels.C1.s}/${levels.C1.n} &nbsp; • &nbsp; <b>C2:</b> ${levels.C2.s}/${levels.C2.n}</p><p>${pct>=80?'Strong performance. Review any missed topics before your next attempt.':pct>=60?'Good progress. Review the weaker topics and try again.':'Review the learning modules, then attempt the challenge again.'}</p></div><div class="card"><h2>Topic Performance</h2>${Object.entries(topics).map(([k,v])=>`<p><b>${k}</b> — ${v.s}/${v.n} (${Math.round(v.s/v.n*100)}%)</p>`).join('')}<div class="notice">When ready, submit this attempt to your lecturer. Submit only once.</div><div class="row"><button id="submitBtn" class="btn" onclick="submitResult()">Submit Result to Lecturer</button><button class="btn secondary" onclick="startQuiz()">Try New Random Set</button><button class="btn ghost" onclick="home()">Back to Learning</button></div><div id="submitState" class="submitstate"></div></div>`;scrollTo(0,0)}
async function submitResult(){if(!lastResult)return;const btn=document.getElementById('submitBtn'),state=document.getElementById('submitState');const fingerprint=student.id+'|'+lastResult.attempt+'|'+lastResult.score+'|'+JSON.stringify(answers);if(localStorage.getItem('csc121submitted')===fingerprint){state.textContent='This result has already been submitted from this device.';btn.disabled=true;return}btn.disabled=true;btn.textContent='Submitting…';state.textContent='Sending result to lecturer…';try{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastResult)});localStorage.setItem('csc121submitted',fingerprint);localStorage.setItem('csc121attempt_'+student.id,String(lastResult.attempt));state.textContent='✓ Result submitted. Please do not submit this attempt again.';btn.textContent='Submitted ✓'}catch(e){state.textContent='Submission could not be sent. Check your internet connection and try again.';btn.disabled=false;btn.textContent='Submit Result to Lecturer'}}
function resetProgress(){if(confirm('Reset completed-module progress?')){done=[];localStorage.removeItem('csc121done');home()}}
home();
</script></body></html>
